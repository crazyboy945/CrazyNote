name: 构建桌面客户端

# 在桌面端源码变更时自动构建 Linux / Windows 产物。
# Linux 的 AppImage 与 deb 必须在 Linux 宿主上打包（分别依赖 mksquashfs 与 Ruby fpm），
# 本地 Windows 机器只能产出 tar.gz，因此放到 CI 里出完整格式。
on:
  push:
    branches: [main]
    paths:
      - 'desktop/**'
      - '.github/workflows/build-desktop.yml'
    tags:
      - 'v*'
  workflow_dispatch:

# 需要 issues: write 才能在构建失败时把日志写成 issue（便于排查）
permissions:
  contents: write
  issues: write

jobs:
  build-linux:
    name: Linux (AppImage / deb / tar.gz)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: 安装依赖
        working-directory: desktop
        # --include=dev：确保 electron / electron-builder 等构建期依赖一定装上，
        # 否则 electron-builder 解析不出 Electron 版本会直接失败
        run: npm ci --include=dev

      - name: 生成图标（含 Linux 多尺寸图标集）
        working-directory: desktop
        run: npm run icons

      - name: 打包 Linux
        working-directory: desktop
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ELECTRON_BUILDER_ALLOW_UNRESOLVED_DEPENDENCIES: true
        run: |
          set +e
          # --publish never：不要让 electron-builder 自己尝试发布（CI 里由 workflow 统一发 Release）
          npx --no-install electron-builder --linux AppImage deb tar.gz --x64 --publish never > build-linux.log 2>&1
          rc=$?
          # 日志尾部写进 job summary；失败时再写成 issue（无需 admin 权限即可读取）
          {
            echo "### 构建日志（退出码 $rc）"
            echo '```'
            tail -80 build-linux.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$rc" != "0" ]; then
            {
              echo "自动采集的 CI 构建失败日志（run #${{ github.run_number }}）"
              echo '```'
              tail -80 build-linux.log
              echo '```'
            } > build-failure.md
            gh issue create --title "CI 构建失败 #${{ github.run_number }}" --body-file build-failure.md || true
          fi
          cat build-linux.log
          exit $rc

      - name: 上传 Linux 产物
        uses: actions/upload-artifact@v4
        with:
          name: CrazyNote-linux-x64
          path: |
            desktop/release/*.AppImage
            desktop/release/*.deb
            desktop/release/*.tar.gz
          if-no-files-found: error
          retention-days: 30

      # 打 tag（v1.0.6）时发布 Release，产物可公开下载
      - name: 发布 Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            desktop/release/*.AppImage
            desktop/release/*.deb
            desktop/release/*.tar.gz
          generate_release_notes: true

  build-windows:
    name: Windows (安装包 / 免安装 zip)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: 安装依赖
        working-directory: desktop
        run: npm ci --include=dev

      - name: 生成图标
        working-directory: desktop
        run: npm run icons

      - name: 打包 Windows
        working-directory: desktop
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ELECTRON_BUILDER_ALLOW_UNRESOLVED_DEPENDENCIES: true
        shell: bash
        run: |
          set +e
          # --publish never：不要让 electron-builder 自己尝试发布（CI 里由 workflow 统一发 Release）
          npx --no-install electron-builder --win --x64 --publish never > build-win.log 2>&1
          rc=$?
          {
            echo "### 构建日志（退出码 $rc）"
            echo '```'
            tail -80 build-win.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$rc" != "0" ]; then
            {
              echo "自动采集的 CI 构建失败日志（run #${{ github.run_number }}）"
              echo '```'
              tail -80 build-win.log
              echo '```'
            } > build-failure.md
            gh issue create --title "CI 构建失败 #${{ github.run_number }}" --body-file build-failure.md || true
          fi
          cat build-win.log
          exit $rc

      - name: 上传 Windows 产物
        uses: actions/upload-artifact@v4
        with:
          name: CrazyNote-windows-x64
          path: |
            desktop/release/*.exe
            desktop/release/*.zip
          if-no-files-found: error
          retention-days: 30
