name: 构建桌面客户端

# 构建 Linux / Windows 桌面端与 fnOS 应用包。
# Linux 的 AppImage 与 deb 必须在 Linux 宿主上打包（分别依赖 mksquashfs 与 Ruby fpm），
# 本地 Windows 机器只能产出 tar.gz，因此放到 CI 里出完整格式。
on:
  push:
    branches: [main]
    paths:
      - 'desktop/**'
      - '.github/workflows/build-desktop.yml'
      - 'cmd/**'
      - 'internal/**'
      - 'scripts/**'
      - 'packaging/**'
      - 'go.mod'
      - 'go.sum'
    tags:
      - 'v*'
  workflow_dispatch:

# 需要 issues: write 才能在构建失败时把日志写成 issue（便于排查）
permissions:
  contents: write
  issues: write

jobs:
  build-linux:
    name: Linux (AppImage / deb / tar.gz)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: 安装依赖
        working-directory: desktop
        # --include=dev：确保 electron / electron-builder 等构建期依赖一定装上
        run: npm ci --include=dev

      - name: 生成图标（含 Linux 多尺寸图标集）
        working-directory: desktop
        run: npm run icons

      - name: 打包 Linux
        working-directory: desktop
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ELECTRON_BUILDER_ALLOW_UNRESOLVED_DEPENDENCIES: true
        run: |
          set +e
          # --publish never：不要让 electron-builder 自己尝试发布（由 release job 统一发）
          npx --no-install electron-builder --linux AppImage deb tar.gz --x64 --publish never > build-linux.log 2>&1
          rc=$?
          # 日志尾部写进 job summary；失败时再写成 issue（无需 admin 权限即可读取）
          {
            echo "### 构建日志（退出码 $rc）"
            echo '```'
            tail -80 build-linux.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$rc" != "0" ]; then
            {
              echo "自动采集的 CI 构建失败日志（run #${{ github.run_number }}）"
              echo '```'
              tail -80 build-linux.log
              echo '```'
            } > build-failure.md
            gh issue create --title "CI 构建失败 #${{ github.run_number }}" --body-file build-failure.md || true
          fi
          cat build-linux.log
          exit $rc

      - name: 上传 Linux 产物
        uses: actions/upload-artifact@v4
        with:
          name: CrazyNote-linux-x64
          path: |
            desktop/release/*.AppImage
            desktop/release/*.deb
            desktop/release/*.tar.gz
          if-no-files-found: error
          retention-days: 30

  build-windows:
    name: Windows (安装包 / 免安装 zip)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: 安装依赖
        working-directory: desktop
        run: npm ci --include=dev

      - name: 生成图标
        working-directory: desktop
        run: npm run icons

      - name: 打包 Windows
        working-directory: desktop
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ELECTRON_BUILDER_ALLOW_UNRESOLVED_DEPENDENCIES: true
        shell: bash
        run: |
          set +e
          npx --no-install electron-builder --win --x64 --publish never > build-win.log 2>&1
          rc=$?
          {
            echo "### 构建日志（退出码 $rc）"
            echo '```'
            tail -80 build-win.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$rc" != "0" ]; then
            {
              echo "自动采集的 CI 构建失败日志（run #${{ github.run_number }}）"
              echo '```'
              tail -80 build-win.log
              echo '```'
            } > build-failure.md
            gh issue create --title "CI 构建失败 #${{ github.run_number }}" --body-file build-failure.md || true
          fi
          cat build-win.log
          exit $rc

      - name: 上传 Windows 产物
        uses: actions/upload-artifact@v4
        with:
          name: CrazyNote-windows-x64
          path: |
            desktop/release/*.exe
            desktop/release/*.zip
          if-no-files-found: error
          retention-days: 30

  build-fpk:
    name: fnOS 应用包 (fpk)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.3'
          cache-dependency-path: go.sum

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 交叉编译各架构二进制
        run: |
          # tag 形如 v1.0.6 → 版本号 1.0.6；分支构建时回落到固定版本
          VERSION="${GITHUB_REF_NAME#v}"
          if ! echo "$VERSION" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            VERSION="1.0.6"
          fi
          echo "使用版本号: $VERSION"
          export VERSION
          bash scripts/build.sh

      - name: 组装 fpk
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if ! echo "$VERSION" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            VERSION="1.0.6"
          fi
          export VERSION
          python3 scripts/build_fpk.py

      - name: 上传 fpk
        uses: actions/upload-artifact@v4
        with:
          name: fnos-fpk
          path: dist/*.fpk
          if-no-files-found: error
          retention-days: 30

  # 统一在打 tag 时发布 Release，把三类产物一起挂上去
  release:
    name: 发布 Release
    needs: [build-linux, build-windows, build-fpk]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: 生成发布说明
        run: |
          cat > release-notes.md <<EOF
          ## CrazyNote ${{ github.ref_name }}

          ### fnOS（飞牛 NAS）应用包
          - \`crazynote-${{ github.ref_name }}.fpk\` —— 应用中心「手动安装」

          ### 桌面客户端
          - \`CrazyNote-${{ github.ref_name }}-linux-x64.AppImage\` —— Linux 单文件版
          - \`crazynote-${{ github.ref_name }}-linux-amd64.deb\` —— Debian / Ubuntu
          - \`CrazyNote-${{ github.ref_name }}-linux-x64.tar.gz\` —— Linux 免安装版（自带 install.sh）
          - \`CrazyNote-${{ github.ref_name }}-x64.exe\` —— Windows 安装包
          - \`CrazyNote-${{ github.ref_name }}-x64.zip\` —— Windows 免安装版
          EOF

      - name: 发布 Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: release-notes.md
          files: |
            artifacts/**/*.AppImage
            artifacts/**/*.deb
            artifacts/**/*.tar.gz
            artifacts/**/*.exe
            artifacts/**/*.zip
            artifacts/**/*.fpk
          generate_release_notes: true
          fail_on_unmatched_files: true
